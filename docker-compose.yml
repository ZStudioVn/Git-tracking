version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gittracking_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gittracking
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis — uncomment when Phase 4 (BullMQ) is reached (D-01)
  # redis:
  #   image: redis:7-alpine
  #   container_name: gittracking_redis
  #   restart: unless-stopped
  #   ports:
  #     - '6379:6379'
  #   volumes:
  #     - redis_data:/data

volumes:
  postgres_data:
  # redis_data:
